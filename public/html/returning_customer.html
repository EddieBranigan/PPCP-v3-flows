<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Returning customer flow</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Save PayPal for purchase later</h1>
    <h3>Returning customer flow.</h3>
    <form id="tokenForm">
        <label for="tokenId">Customer token id:</label>
        <input type="text" id="tokenId" name="tokenId" value="fpQIroiYPJ">
        <fieldset>
  <legend>Paylater</legend>

  <div>
    <input type="checkbox" id="paylaterButton" name="paylaterButton" checked />
    <label for="paylaterButton">Paylater button?</label>
  </div>

  <div>
    <input type="checkbox" id="paylaterMessage" name="paylaterMessage" />
    <label for="paylaterMessage">Paylater messaging?</label>
  </div>
</fieldset>
        <input type="submit" value="Submit">
    </form>
    <div id="paypal-button-container" style="display: none;"></div>
    <p id="result-message"></p>
    <script type="text/javascript" src="js/re_script.js"></script>
</body>

</html>
